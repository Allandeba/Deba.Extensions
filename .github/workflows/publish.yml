name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated packages to the configured NuGet feed (main only)
        type: boolean
        required: true
        default: false
      customPackageVersion:
        description: Optional package version; leave empty to use GitVersion SemVer
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'
          preferLatestVersion: true

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true
          updateAssemblyInfo: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Deba.Extensions.sln

      - name: Build
        env:
          PACKAGE_VERSION: ${{ inputs.customPackageVersion || steps.gitversion.outputs.semVer }}
        run: dotnet build Deba.Extensions.sln --configuration "$CONFIGURATION" --no-restore -p:GeneratePackageOnBuild=false -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Test .NET 10 contracts
        run: dotnet test Deba.Extensions.sln --configuration "$CONFIGURATION" --no-build --no-restore --logger "trx;LogFileName=contracts-net10.trx" --results-directory ./artifacts/test-results -p:GeneratePackageOnBuild=false

      - name: Generate package
        env:
          PACKAGE_VERSION: ${{ inputs.customPackageVersion || steps.gitversion.outputs.semVer }}
        run: dotnet pack Deba.Extensions/Deba.Extensions.csproj --configuration "$CONFIGURATION" --no-build --no-restore --output ./artifacts/packages -p:GeneratePackageOnBuild=false -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: allandeba

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SERVER: ${{ vars.NUGET_SERVER }}
        run: dotnet nuget push ./artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source "$NUGET_SERVER" --skip-duplicate
